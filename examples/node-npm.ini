# Node with npm (Express, Next.js, CLI tools)
# Run:  treepot npm run dev     (a server must listen on 0.0.0.0)
[app]
    image = node:22
    setup = npm install
    # A relative cache path is inside the worktree: node_modules lives in a per-worktree volume,
    # so Linux builds of native modules never mix with the host's.
    cache = node_modules
