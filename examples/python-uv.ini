# Python with uv and a pyproject.toml (FastAPI, CLI tools, libraries)
# Run:  treepot uv run fastapi dev --host 0.0.0.0     treepot uv run pytest
[app]
    image = ghcr.io/astral-sh/uv:python3.13-bookworm
    setup = uv sync
    cache = /cache
    env = UV_PROJECT_ENVIRONMENT=/cache/venv
    env = UV_LINK_MODE=copy
