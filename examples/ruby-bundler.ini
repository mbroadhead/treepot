# Ruby that is not Rails (CLI tools, gems, Sinatra), with or without a Gemfile
# Run:  treepot ruby bin/mytool     treepot bundle exec rake test
# Rails apps need no config file. Without one, a project with a Gemfile gets the Rails-ready image
# (Node, database clients); this uses the plain Ruby image instead. Gems are installed automatically.
[app]
    image = ruby:3.4
