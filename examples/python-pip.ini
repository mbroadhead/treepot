# Python with pip and requirements.txt (Django, Flask)
# Run:  treepot python manage.py runserver 0.0.0.0:8000
# Django does not read DATABASE_URL by itself: use dj-database-url, or the PG* variables in settings.
[app]
    image = python:3.13
    setup = "[ -x /cache/venv/bin/pip ] || python -m venv /cache/venv; pip install -q -r requirements.txt"
    cache = /cache
    env = VIRTUAL_ENV=/cache/venv
    env = PATH=/cache/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
