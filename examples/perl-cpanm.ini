# Perl with a cpanfile, Makefile.PL or Build.PL (Mojolicious, Dancer, CLI tools, modules)
# Run:  treepot perl app.pl daemon -l http://0.0.0.0:3000     treepot prove -lr t
[app]
    image = perl:5.40
    # -n skips module test suites
    setup = cpanm -n -q -L /cache/perl5 --installdeps .
    cache = /cache
    env = PERL5LIB=/cache/perl5/lib/perl5
    env = PATH=/cache/perl5/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
